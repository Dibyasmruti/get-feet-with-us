server.port=${PORT:8085}
server.servlet.session.timeout=120m

spring.application.name=get-feet-with-us

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dibya002?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Dibya@2001D}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=${APP_UPLOAD_DIR:uploads/}

logging.level.com.getfeetwithus=INFO
logging.level.org.springframework.security=WARN

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Meeting Management - Admin')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/admin_navbar :: admin_navbar}"></nav>

<main class="main-content py-4">
    <div class="container-fluid px-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1"><i class="bi bi-calendar-event-fill text-warning me-2"></i> Meeting Management</h3>
                <p class="text-muted small mb-0">Schedule live sessions, hybrid seminars, and manage interactive community meetings</p>
            </div>
            <a th:href="@{/admin/meetings/new}" class="btn btn-warning text-dark btn-sm rounded-pill px-3 shadow-sm fw-semibold">
                <i class="bi bi-calendar-plus me-1"></i> Schedule New Meeting
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 rounded-4 shadow-sm bg-white overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Meeting ID</th>
                                <th>Date & Time</th>
                                <th>Topic & Host</th>
                                <th>Mode</th>
                                <th>Venue / Link</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${meetings}">
                                <td class="ps-4 fw-bold text-dark" th:text="${m.meetingId}">MTG101</td>
                                <td>
                                    <strong class="text-dark d-block" th:text="${#temporals.format(m.meetingDate, 'dd-MM-yyyy')}">01-01-2026</strong>
                                    <small class="text-muted" th:text="${m.startTime} + ' (' + ${m.duration} + ')'">10:00 (45 mins)</small>
                                </td>
                                <td>
                                    <h6 class="fw-bold text-dark mb-0" th:text="${m.topic}">Topic</h6>
                                    <small class="text-muted"><i class="bi bi-person me-1"></i> Host: <span th:text="${m.hostDetails}">Host</span></small>
                                </td>
                                <td>
                                    <span class="badge bg-warning-subtle text-dark border border-warning-subtle rounded-pill" th:text="${m.meetingMode}">Online</span>
                                </td>
                                <td>
                                    <a th:if="${m.meetingLink != null && !m.meetingLink.isBlank()}" th:href="${m.meetingLink}" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill py-0 px-2 small">
                                        <i class="bi bi-link-45deg me-1"></i> Link
                                    </a>
                                    <span th:if="${m.meetingAddress != null && !m.meetingAddress.isBlank()}" class="small text-muted d-block text-truncate" style="max-width: 150px;" th:text="${m.meetingAddress}">Address</span>
                                </td>
                                <td>
                                    <span th:if="${m.isCancelled}" class="badge bg-danger rounded-pill">Cancelled</span>
                                    <span th:if="${!m.isCancelled && m.isActive}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Active</span>
                                    <span th:if="${!m.isCancelled && !m.isActive}" class="badge bg-secondary rounded-pill">Draft</span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/admin/meetings/edit/' + ${m.meetingId}}" class="btn btn-outline-primary rounded-pill me-1"><i class="bi bi-pencil me-1"></i> Edit</a>
                                        <form th:if="${!m.isCancelled}" th:action="@{'/admin/meetings/cancel/' + ${m.meetingId}}" method="post" class="d-inline me-1">
                                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill" title="Cancel Meeting">
                                                Cancel
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/meetings/toggle/' + ${m.meetingId}}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm rounded-pill" th:classappend="${m.isActive ? 'btn-outline-secondary' : 'btn-outline-success'}">
                                                <span th:text="${m.isActive ? 'Hide' : 'Show'}">Toggle</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Product Form - Admin')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/admin_navbar :: admin_navbar}"></nav>

<main class="main-content py-4">
    <div class="container py-2" style="max-width: 850px;">
        <!-- Breadcrumb -->
        <nav class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-success text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/products}" class="text-success text-decoration-none">Products</a></li>
                <li class="breadcrumb-item active" th:text="${product.id == null ? 'New Product' : 'Edit Product'}">Form</li>
            </ol>
        </nav>

        <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5">
            <h4 class="fw-bold text-dark mb-4" th:text="${product.id == null ? 'Add New Product' : 'Edit Product: ' + product.productId}">Product Form</h4>

            <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{productId}">
                <input type="hidden" th:field="*{imageUrl}">

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Product Name *</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Organic Herbal Detox Tea" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Unit Price (Rs.) *</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="499.00" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Short Description (for listing cards) *</label>
                        <input type="text" th:field="*{shortDescription}" class="form-control" placeholder="100% natural antioxidant herbal tea" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Full Product Description *</label>
                        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Comprehensive product background and benefits"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Why To Use</label>
                        <textarea th:field="*{whyToUse}" class="form-control" rows="3" placeholder="Aids digestion and revitalizes metabolism"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Who Can Use</label>
                        <textarea th:field="*{whoCanUse}" class="form-control" rows="3" placeholder="Adults, fitness enthusiasts"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">How To Use</label>
                        <textarea th:field="*{howToUse}" class="form-control" rows="3" placeholder="Infuse 1 bag in warm water twice daily"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Other Instructions</label>
                        <textarea th:field="*{otherInstructions}" class="form-control" rows="2" placeholder="Keep in a cool dry place away from direct sunlight"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Upload Product Image</label>
                        <input type="file" name="imageFile" class="form-control" accept="image/*">
                        <small class="text-muted" th:if="${product.imageUrl != null}">Current image saved.</small>
                    </div>

                    <div class="col-md-3">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{isAvailable}" id="availSwitch">
                            <label class="form-check-label fw-semibold" for="availSwitch">In Stock</label>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="activeSwitch">
                            <label class="form-check-label fw-semibold" for="activeSwitch">Active In Catalog</label>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-4">
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary me-2 rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Save Product
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

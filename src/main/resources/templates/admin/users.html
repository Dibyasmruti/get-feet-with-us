<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('User Management - Admin')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/admin_navbar :: admin_navbar}"></nav>

<main class="main-content py-4">
    <div class="container-fluid px-4">
        <!-- Header & Search -->
        <div class="row align-items-center mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <h3 class="fw-bold text-dark mb-1"><i class="bi bi-people-fill text-primary me-2"></i> User Management</h3>
                <p class="text-muted small mb-0">View registered users, search profiles, and manage account statuses</p>
            </div>
            <div class="col-md-6">
                <form th:action="@{/admin/users}" method="get" class="d-flex gap-2 justify-content-md-end">
                    <input type="text" name="search" th:value="${search}" class="form-control form-control-sm" placeholder="Search by name, User ID, email, mobile..." style="max-width: 320px;">
                    <button type="submit" class="btn btn-primary btn-sm px-3 rounded-pill">
                        <i class="bi bi-search me-1"></i> Search
                    </button>
                    <a th:if="${search != null && !search.isBlank()}" th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm rounded-pill">Reset</a>
                </form>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 rounded-4 shadow-sm overflow-hidden bg-white">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">User ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Registered Date</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="ps-4">
                                    <span class="badge bg-light text-dark border fw-bold" th:text="${u.userId}">USR1001</span>
                                </td>
                                <td class="fw-bold text-dark" th:text="${u.name}">John Doe</td>
                                <td th:text="${u.email}">john@example.com</td>
                                <td th:text="${u.mobileNumber}">9876543210</td>
                                <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd-MM-yyyy')}">01-01-2026</td>
                                <td>
                                    <span th:if="${u.isActive}" class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1 rounded-pill">Active</span>
                                    <span th:unless="${u.isActive}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-1 rounded-pill">Deactivated</span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/admin/users/' + ${u.userId}}" class="btn btn-outline-primary rounded-pill me-1" title="View Details">
                                            <i class="bi bi-eye me-1"></i> Details
                                        </a>
                                        <form th:action="@{'/admin/users/' + ${u.userId} + '/toggle'}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm rounded-pill" th:classappend="${u.isActive ? 'btn-outline-danger' : 'btn-outline-success'}">
                                                <i th:class="${u.isActive ? 'bi bi-person-x' : 'bi bi-person-check'}"></i>
                                                <span th:text="${u.isActive ? 'Deactivate' : 'Activate'}">Toggle</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

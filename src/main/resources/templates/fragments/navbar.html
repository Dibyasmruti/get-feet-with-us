<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
            <i class="bi bi-heart-pulse-fill text-success fs-3 me-2"></i>
            <span>Get Feet With Us</span>
            <span class="brand-badge ms-2">Member</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="userNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/diet}"><i class="bi bi-cup-hot-fill me-1"></i> Today's Diet</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/fitness}"><i class="bi bi-activity me-1"></i> Fitness & Yoga</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"><i class="bi bi-bag-check-fill me-1"></i> Products</a>
                </li>
                <li class="nav-item nav-notification-dot">
                    <a class="nav-link" th:href="@{/meetings}">
                        <i class="bi bi-calendar-event-fill me-1"></i> Meetings
                        <span th:if="${hasTodayMeeting}" class="dot-badge" title="Meeting scheduled for today!"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}"><i class="bi bi-info-circle-fill me-1"></i> About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/settings}"><i class="bi bi-gear-fill me-1"></i> Settings</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/cart}" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3"></i>
                    <span th:if="${cartCount != null && cartCount > 0}" th:text="${cartCount}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                </a>
                <a th:href="@{/orders}" class="btn btn-outline-light btn-sm"><i class="bi bi-receipt me-1"></i> My Orders</a>
                <div class="dropdown">
                    <button class="btn btn-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i> <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-person-gear me-2"></i>Profile & Address</a></li>
                        <li><a class="dropdown-item" th:href="@{/change-password}"><i class="bi bi-key-fill me-2"></i>Change Password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-danger btn-sm w-100"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Forgot Password')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-warning text-dark mb-2 shadow">
                    <i class="bi bi-shield-lock fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark">Password Recovery</h3>
                <p class="text-muted">Reset your account password</p>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/forgot-password}" th:object="${forgotDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">User ID / Registered Email / Mobile</label>
                            <input type="text" th:field="*{identifier}" class="form-control" placeholder="e.g. USR1001 or email" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('identifier')}" th:errors="*{identifier}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="At least 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat new password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold rounded-3 shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Reset Password
                        </button>
                    </form>

                    <div class="text-center pt-3 mt-3 border-top">
                        <a th:href="@{/login}" class="text-success text-decoration-none small fw-bold">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Access Denied')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div class="container my-auto py-5 text-center">
    <div class="display-1 text-danger mb-3"><i class="bi bi-shield-x"></i></div>
    <h2 class="fw-bold text-dark">Access Denied</h2>
    <p class="text-muted">You do not have permission to access the requested resource.</p>
    <div class="mt-4">
        <a th:href="@{/dashboard}" class="btn btn-success px-4 py-2 me-2"><i class="bi bi-house-door-fill me-1"></i> Go to Dashboard</a>
        <a th:href="@{/login}" class="btn btn-outline-secondary px-4 py-2"><i class="bi bi-box-arrow-in-right me-1"></i> Login Page</a>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

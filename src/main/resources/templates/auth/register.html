<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('User Registration')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success text-white mb-2 shadow">
                    <i class="bi bi-person-plus-fill fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark">Join Get Feet With Us</h3>
                <p class="text-muted">Create your wellness account</p>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. John Doe" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mobile Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                                    <input type="text" th:field="*{mobileNumber}" class="form-control" placeholder="10-digit number" required maxlength="10">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Delivery Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" th:field="*{address}" class="form-control" placeholder="House / Flat / Street / Area" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">PIN Code *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-pin-map"></i></span>
                                    <input type="text" th:field="*{pinCode}" class="form-control" placeholder="6 digits" required maxlength="6">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('pinCode')}" th:errors="*{pinCode}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mt-4 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center pt-3 mt-3 border-top">
                        <p class="mb-0 text-muted small">Already registered? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Log in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

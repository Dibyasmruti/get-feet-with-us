<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Change Password')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-0 pt-4 px-4 text-center">
                    <div class="d-inline-flex p-3 rounded-circle bg-success text-white mb-2 shadow-sm">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Change Password</h4>
                    <p class="text-muted small">Update your account security</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/change-password}" th:object="${changeDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Current Password</label>
                            <input type="password" th:field="*{oldPassword}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1 py-2 fw-semibold rounded-3 shadow-sm">
                                <i class="bi bi-check2 me-1"></i> Update Password
                            </button>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary py-2 rounded-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

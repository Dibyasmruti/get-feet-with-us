<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Admin Password Recovery')}"></head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-warning text-dark mb-2 shadow">
                    <i class="bi bi-shield-lock-fill fs-1"></i>
                </div>
                <h3 class="fw-bold text-white">Admin Recovery</h3>
                <p class="text-muted">Reset Administrator Password</p>
            </div>

            <div class="card shadow border-0 rounded-4 bg-secondary bg-opacity-25 text-white">
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/admin/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Admin ID (e.g. ADMIN001 / ADMIN002 / ADMIN003)</label>
                            <input type="text" name="adminId" class="form-control bg-dark border-secondary text-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">New Password</label>
                            <input type="password" name="newPassword" class="form-control bg-dark border-secondary text-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Confirm New Password</label>
                            <input type="password" name="confirmPassword" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <button type="submit" class="btn btn-warning text-dark w-100 py-2 fw-bold rounded-3 shadow">
                            <i class="bi bi-check2-circle me-1"></i> Reset Admin Password
                        </button>
                    </form>

                    <div class="text-center pt-3 mt-3 border-top border-secondary">
                        <a th:href="@{/admin/login}" class="text-warning text-decoration-none small">
                            <i class="bi bi-arrow-left me-1"></i> Back to Admin Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

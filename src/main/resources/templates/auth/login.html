<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('User Login')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success text-white mb-2 shadow">
                    <i class="bi bi-heart-pulse-fill fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark">Get Feet With Us</h3>
                <p class="text-muted">User Portal Access</p>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/perform-login}" method="post">
                        <input type="hidden" name="isAdmin" value="false">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">User ID / Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="e.g. USR1001 or email" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-semibold mb-0">Password</label>
                                <a th:href="@{/forgot-password}" class="text-decoration-none small text-success">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                        </button>
                    </form>

                    <div class="text-center pt-2 border-top">
                        <p class="mb-2 text-muted small">Don't have an account?</p>
                        <a th:href="@{/register}" class="btn btn-outline-success btn-sm w-100 fw-semibold rounded-3">
                            <i class="bi bi-person-plus-fill me-1"></i> Sign Up
                        </a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/admin/login}" class="text-muted small text-decoration-none">
                    <i class="bi bi-shield-lock me-1"></i> Switch to Administrator Login
                </a>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

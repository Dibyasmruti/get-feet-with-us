<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Products')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="main-content py-4">
    <div class="container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1"><i class="bi bi-bag-check-fill text-primary me-2"></i> Wellness Products</h3>
                <p class="text-muted small mb-0">Discover authentic health supplements and wellness essentials</p>
            </div>
            <a th:href="@{/cart}" class="btn btn-primary btn-sm rounded-pill px-3">
                <i class="bi bi-cart3 me-1"></i> View Cart (<span th:text="${cartCount != null ? cartCount : 0}">0</span>)
            </a>
        </div>

        <!-- Products Grid -->
        <div class="row g-4">
            <div th:each="prod : ${products}" class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100 product-card d-flex flex-column">
                    <div class="product-img-holder position-relative">
                        <img th:if="${prod.imageUrl != null && !prod.imageUrl.isBlank()}" th:src="${prod.imageUrl}" alt="Product Image">
                        <div th:unless="${prod.imageUrl != null && !prod.imageUrl.isBlank()}" class="text-muted">
                            <i class="bi bi-box-seam fs-1 opacity-50"></i>
                        </div>
                        <span th:if="${prod.isAvailable}" class="position-absolute top-0 end-0 m-2 badge bg-success-subtle text-success border border-success-subtle rounded-pill">In Stock</span>
                        <span th:unless="${prod.isAvailable}" class="position-absolute top-0 end-0 m-2 badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill">Out of Stock</span>
                    </div>

                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="fw-bold text-dark mb-1 text-truncate" th:text="${prod.name}">Product Name</h6>
                        <p class="text-muted small mb-2 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${prod.shortDescription}">Short description of product...</p>

                        <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
                            <span class="fs-5 fw-bold text-success">Rs. <span th:text="${prod.price}">999</span></span>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{'/products/' + ${prod.productId}}" class="btn btn-outline-secondary btn-sm flex-grow-1 rounded-pill">
                                Details
                            </a>
                            <form th:if="${prod.isAvailable}" th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                <input type="hidden" name="productId" th:value="${prod.productId}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-primary btn-sm w-100 rounded-pill">
                                    <i class="bi bi-cart-plus me-1"></i> Add
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${products == null || products.isEmpty()}" class="col-12">
                <div class="card border-0 rounded-4 shadow-sm p-5 text-center">
                    <i class="bi bi-box-seam text-muted fs-1 mb-2"></i>
                    <h5 class="fw-bold text-dark">No Products Available</h5>
                    <p class="text-muted">Products will appear here once published by the administrator.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
